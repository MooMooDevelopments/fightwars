name: 🧪 CI

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: the full 40-minute-match determinism run.
    - cron: "0 3 * * *"

permissions: {}

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run build-prod
      # FightWars (brief §11): the wire half of the cold-load number, and the
      # initial download with the largest map. scripts/coldLoadGate.ts.
      - run: npm run coldload:gate
      - uses: actions/upload-artifact@v7
        with:
          path: out/index.html
          retention-days: 1

  test:
    name: 🔬 Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage

  api-postgres:
    # The API tests again, on real Postgres instead of PGlite: same SQL, the
    # production adapter (PgDb). Each test file gets its own database.
    name: 🐘 API on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  determinism:
    # THE gate. Two processes replay one intent log and must produce
    # byte-identical state digests. See tests/determinism.test.ts.
    name: 🔁 Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: Quick mode (every push)
        if: github.event_name != 'schedule'
        run: npm run test:determinism
      - name: Full 40-minute match (nightly)
        if: github.event_name == 'schedule'
        run: npm run test:determinism:full

  perf:
    # Fails when the headless sim regresses past the budgets in
    # scripts/perfGate.ts. Numbers are recorded in BUILD-STATE.md.
    name: ⏱️ Perf gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run perf:gate

  licenses:
    # Every shipped dependency must be AGPL-3.0-compatible.
    name: ⚖️ Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run licenses:check

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run lint:github

  prettier:
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npx prettier --check .

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi
